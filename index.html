
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>দেশখোঁজ | DeshKhoj</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #f0f7f2;
      color: #173d2b;
    }
    header {
      background: #087443;
      color: white;
      padding: 24px 16px;
      text-align: center;
    }
    header h1 { margin: 0 0 8px; }
    main { padding: 20px; max-width: 600px; margin: auto; }
    input {
      box-sizing: border-box;
      width: 100%;
      padding: 14px;
      border: 1px solid #b6cdbd;
      border-radius: 10px;
      font-size: 16px;
    }
    h2 { font-size: 20px; }
    .places {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .place {
      background: white;
      padding: 20px 8px;
      text-align: center;
      border-radius: 12px;
      box-shadow: 0 2px 7px #00000010;
      font-weight: bold;
    }
    footer { text-align: center; padding: 24px; color: #52705d; }
  </style>
</head>
<body>
  <header>
    <h1>🇧🇩 দেশখোঁজ</h1>
    <p>বাংলাদেশের প্রতিটি পথ, আপনার হাতের মুঠোয়</p>
  </header>
  <main>
    <input id="search" type="search" placeholder="বিভাগ, জেলা বা স্থান খুঁজুন...">
    <h2>আপনার বাংলাদেশ</h2>
    <div class="places" id="places">
      <div class="place">🏞️ বিভাগ</div>
      <div class="place">🏘️ জেলা</div>
      <div class="place">🏡 উপজেলা</div>
      <div class="place">📍 দর্শনীয় স্থান</div>
    </div>
    <p id="message"></p>
  </main>
  <footer>দেশখোঁজ © 2026 | নিজের দেশ, নিজের ঠিকানা</footer>
  <script>
    document.getElementById('search').addEventListener('input', function() {
      document.getElementById('message').textContent =
        this.value ? 'আপনি খুঁজছেন: ' + this.value : '';
    });
  </script>
</body>
</html>
